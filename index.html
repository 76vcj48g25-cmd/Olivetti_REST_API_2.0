<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Giocatori Pallavolo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Inserimento nuovi giocatori</h1>

        <section class="form-section">
            <form id="formGiocatore">
                <div class="campo">
                    <label for="nome">Nome giocatore</label>
                    <input type="text" id="nome" name="nome" placeholder="Inserisci nome" required>
                </div>

                <div class="campo">
                    <label for="cognome">Cognome giocatore</label>
                    <input type="text" id="cognome" name="cognome" placeholder="Inserisci cognome" required>
                </div>

                <div class="campo">
                    <label for="eta">Età giocatore</label>
                    <input type="number" id="eta" name="eta" min="12" max="40" placeholder="Da 12 a 40" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Seleziona categoria</option>
                    </select>
                </div>

                <button type="submit">Inserisci giocatore</button>
            </form>

            <p id="messaggio"></p>
        </section>

        <section class="lista-section">
            <h2>Giocatori precaricati</h2>

            <div class="filtro">
                <label for="filtroCategoria">Filtra per categoria</label>
                <select id="filtroCategoria">
                    <option value="tutti">Tutti</option>
                </select>
            </div>

            <div id="listaGiocatori" class="lista-giocatori"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
